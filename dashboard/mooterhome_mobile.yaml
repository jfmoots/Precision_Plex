            name: Propane
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 25
              red: 0
      - square: false
        type: grid
        columns: 2
        cards:
          - type: button
            entity: sensor.coach_battery_voltmeter
            name: Coach
            icon: mdi:car-battery
            show_state: true
            color: green
            tap_action:
              action: more-info
          - type: button
            entity: sensor.basement_precision_plex_coach_battery
            name: House
            icon: mdi:battery
            show_state: true
            color: green
            tap_action:
              action: more-info
  - title: Env
    path: environment
    icon: mdi:thermometer-water
    cards:
      - type: custom:mini-graph-card
        name: Living Room
        entities:
          - entity: sensor.living_room_htg3_temperature
            name: Temp
          - entity: sensor.living_room_htg3_humidity
            name: Humidity
      - type: entities
        title: Temperatures
        state_color: false
        entities:
          - entity: sensor.system_monitor_processor_temperature
            name: Raspberry Pi
  - title: Service
    path: service
    icon: mdi:wrench-cog
    cards:
      - type: markdown
        content: >
          ## Service Controls

          These controls affect slide and awning calibration. Record existing
          values before making changes.
      - type: entities
        title: Patio Awning
        show_header_toggle: false
        entities:
          - entity: button.basement_precision_plex_patio_awning_jog_extend
            name: Jog Extend
          - entity: button.basement_precision_plex_patio_awning_jog_retract
            name: Jog Retract
          - entity: number.basement_precision_plex_awning_open_seconds
            name: Open Seconds
          - entity: number.basement_precision_plex_awning_close_seconds
            name: Close Seconds
          - entity: number.basement_precision_plex_awning_jog_seconds
            name: Jog Seconds
          - type: divider
          - entity: button.basement_precision_plex_patio_awning_reset_fully_extended
            name: Reset Fully Extended
          - entity: button.basement_precision_plex_patio_awning_reset_fully_retracted
            name: Reset Fully Retracted
      - type: entities
        title: Bedroom Slide
        show_header_toggle: false
        entities:
          - entity: button.basement_precision_plex_bedroom_slide_jog_extend
            name: Jog Extend
          - entity: button.basement_precision_plex_bedroom_slide_jog_retract
            name: Jog Retract
          - entity: number.basement_precision_plex_bed_slide_open_seconds
            name: Open Seconds
          - entity: number.basement_precision_plex_bed_slide_close_seconds
            name: Close Seconds
          - entity: number.basement_precision_plex_bed_slide_jog_seconds
            name: Jog Seconds
          - type: divider
          - entity: button.basement_precision_plex_bedroom_slide_reset_fully_extended
            name: Reset Fully Extended
          - entity: button.basement_precision_plex_bedroom_slide_reset_fully_retracted
            name: Reset Fully Retracted
      - type: entities
        title: Wardrobe Slide
        show_header_toggle: false
        entities:
          - entity: button.basement_precision_plex_wardrobe_slide_jog_extend
            name: Jog Extend
          - entity: button.basement_precision_plex_wardrobe_slide_jog_retract
            name: Jog Retract
          - entity: number.basement_precision_plex_wardrobe_slide_open_seconds
            name: Open Seconds
          - entity: number.basement_precision_plex_wardrobe_slide_close_seconds
            name: Close Seconds
          - entity: number.basement_precision_plex_wardrobe_slide_jog_seconds
            name: Jog Seconds
          - type: divider
          - entity: button.basement_precision_plex_wardrobe_slide_reset_fully_extended
            name: Reset Fully Extended
          - entity: >-
              button.basement_precision_plex_wardrobe_slide_reset_fully_retracted
            name: Reset Fully Retracted
      - type: entities
        title: Sofa Slide
        show_header_toggle: false
        entities:
          - entity: button.basement_precision_plex_sofa_slide_jog_extend
            name: Jog Extend
          - entity: button.basement_precision_plex_sofa_slide_jog_retract
            name: Jog Retract
          - entity: number.basement_precision_plex_sofa_slide_open_seconds
            name: Open Seconds
          - entity: number.basement_precision_plex_sofa_slide_close_seconds
            name: Close Seconds
          - entity: number.basement_precision_plex_sofa_slide_jog_seconds
            name: Jog Seconds
          - type: divider
          - entity: button.basement_precision_plex_sofa_slide_reset_fully_extended
            name: Reset Fully Extended
          - entity: button.basement_precision_plex_sofa_slide_reset_fully_retracted
            name: Reset Fully Retracted
      - type: entities
        title: Generator Service
        show_header_toggle: false
        entities:
          - entity: binary_sensor.basement_precision_plex_generator_running
            name: Running
          - entity: sensor.basement_precision_plex_generator_status
            name: Status
          - entity: sensor.basement_precision_plex_generator_runtime
            name: Runtime
          - type: divider
          - entity: button.basement_precision_plex_generator_start
            name: Start
          - entity: button.basement_precision_plex_generator_stop
            name: Stop
          - entity: button.basement_precision_plex_generator_autostart
            name: AutoStart
          - entity: button.basement_precision_plex_generator_autostop
            name: AutoStop
