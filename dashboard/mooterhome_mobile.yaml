  - title: Slides
    path: slides
    icon: mdi:arrow-expand-horizontal
    cards:
      - square: false
        type: grid
        columns: 2
        cards:
          - type: button
            entity: cover.basement_precision_plex_patio_awning
            name: Patio Awning
            icon: mdi:awning
            show_state: true
            color: orange
            tap_action:
              action: more-info
            hold_action:
              action: toggle
          - type: button
            entity: cover.basement_precision_plex_bedroom_slide
            name: Bedroom Slide
            icon: mdi:bed
            show_state: true
            color: orange
            tap_action:
              action: more-info
            hold_action:
              action: toggle
          - type: button
            entity: cover.basement_precision_plex_wardrobe_slide
            name: Wardrobe
            icon: mdi:wardrobe
            show_state: true
            color: orange
            tap_action:
              action: more-info
            hold_action:
              action: toggle
          - type: button
            entity: cover.basement_precision_plex_sofa_slide
            name: Sofa Slide
            icon: mdi:sofa
            show_state: true
            color: orange
            tap_action:
              action: more-info
            hold_action:
              action: toggle
  - title: Generator
    path: generator
    icon: mdi:engine
    cards:
      - square: false
        type: grid
        columns: 2
        cards:
          - type: conditional
            conditions:
              - entity: binary_sensor.basement_precision_plex_generator_running
                state: "on"
            card:
              type: button
              entity: binary_sensor.basement_precision_plex_generator_running
              name: Running
              icon: mdi:engine
              color: green
              show_state: true
              tap_action:
                action: more-info
          - type: conditional
            conditions:
              - entity: binary_sensor.basement_precision_plex_generator_running
                state_not: "on"
            card:
              type: button
              entity: binary_sensor.basement_precision_plex_generator_running
              name: Generator
              icon: mdi:engine-off
              color: disabled
              show_state: true
              tap_action:
                action: more-info
          - type: button
            entity: sensor.basement_precision_plex_generator_status
            name: Status
            icon: mdi:information
            show_state: true
            tap_action:
              action: more-info
          - type: button
            entity: sensor.basement_precision_plex_generator_runtime
            name: Runtime
            icon: mdi:timer-outline
            show_state: true
            tap_action:
              action: more-info
          - type: button
            entity: button.basement_precision_plex_generator_autostart
            name: AutoStart
            icon: mdi:play-speed
            color: green
            show_state: false
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.basement_precision_plex_generator_autostart
          - type: button
            entity: button.basement_precision_plex_generator_autostop
            name: AutoStop
            icon: mdi:stop-circle-outline
            color: orange
            show_state: false
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.basement_precision_plex_generator_autostop
