# Mooterhome Mobile Dashboard Example
#
# This dashboard is a mobile-friendly Home Assistant dashboard used with the
# Precision Plex integration on a 2022 Forest River Georgetown GT5 34M5.
#
# It intentionally demonstrates a complete RV Home Assistant installation,
# not only entities created by the Precision Plex integration.
#
# Non-Precision Plex example entities in this dashboard include:
# - Interior lights exposed through Shelly relays
# - Coach/chassis battery voltage from a Shelly UNI
# - Living room temperature/humidity from a Shelly environmental sensor
# - Raspberry Pi temperature from the Home Assistant System Monitor integration
#
# Replace entity IDs with the matching entities from your own installation.

title: Mooterhome Mobile
views:
  - title: Home
    path: home
    icon: mdi:rv-truck
    cards:
      - square: false
        type: grid
        columns: 2
        cards:
          - type: gauge
            entity: sensor.basement_precision_plex_fresh_water
            name: Fresh
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 33
              red: 67
          - type: gauge
            entity: sensor.basement_precision_plex_grey_tank
            name: Grey
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 33
              red: 67
          - type: gauge
            entity: sensor.basement_precision_plex_black_tank
            name: Black
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 33
              red: 67
            needle: true
          - type: gauge
            entity: sensor.basement_precision_plex_propane
            name: Propane
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 25
              red: 0
      - type: horizontal-stack
        cards:
          - type: conditional
            conditions:
              - entity: switch.basement_precision_plex_water_pump
                state: "on"
            card:
              type: button
              entity: switch.basement_precision_plex_water_pump
              name: Water Pump
              icon: mdi:water-pump
              color: green
              show_name: true
              show_icon: true
              show_state: true
              tap_action:
                action: toggle
          - type: conditional
            conditions:
              - entity: switch.basement_precision_plex_water_pump
                state_not: "on"
            card:
              type: button
              entity: switch.basement_precision_plex_water_pump
              name: Water Pump
              icon: mdi:water-pump-off
              color: disabled
              show_name: true
              show_icon: true
              show_state: true
              tap_action:
                action: toggle
          - type: conditional
            conditions:
              - entity: switch.basement_precision_plex_water_heater
                state: "on"
            card:
              type: button
              entity: switch.basement_precision_plex_water_heater
              name: Water Heater
              icon: mdi:water-boiler
              color: orange
              show_name: true
              show_icon: true
              show_state: true
              tap_action:
                action: toggle
          - type: conditional
            conditions:
              - entity: switch.basement_precision_plex_water_heater
                state_not: "on"
            card:
              type: button
              entity: switch.basement_precision_plex_water_heater
              name: Water Heater
              icon: mdi:water-boiler-off
              color: disabled
              show_name: true
              show_icon: true
              show_state: true
              tap_action:
                action: toggle
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            entity: sensor.coach_battery_voltmeter
            name: Coach Battery
            icon: mdi:car-battery
            color: green
            show_state: true
            tap_action:
              action: more-info
          - type: button
            entity: sensor.basement_precision_plex_coach_battery
            name: House Battery
            icon: mdi:battery-high
            color: green
            show_state: true
            tap_action:
              action: more-info
          - type: conditional
            conditions:
              - entity: binary_sensor.basement_precision_plex_generator_running
                state: "on"
            card:
              type: button
              entity: sensor.basement_precision_plex_generator_runtime
              name: Generator
              icon: mdi:engine
              color: red
              show_state: true
              tap_action:
                action: more-info
          - type: conditional
            conditions:
              - entity: binary_sensor.basement_precision_plex_generator_running
                state_not: "on"
            card:
              type: button
              entity: sensor.basement_precision_plex_generator_runtime
              name: Generator
              icon: mdi:engine-off
              color: disabled
              show_state: true
              tap_action:
                action: more-info
